<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>مترجم وصرف العملات</title>
<style>
  * { box-sizing: border-box; touch-action: manipulation; }
  html, body { height: 100%; margin: 0; touch-action: manipulation; overscroll-behavior: none; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    color: #222;
    background:
      radial-gradient(circle, rgba(31,59,115,.12) 1.5px, transparent 2px) 0 0 / 26px 26px,
      radial-gradient(circle at 10% 15%, #cfe0ff 0%, transparent 45%),
      radial-gradient(circle at 90% 85%, #ffe3c7 0%, transparent 45%),
      linear-gradient(160deg, #eef4ff 0%, #f7f2ff 50%, #fff5ea 100%);
    height: 100vh; height: 100dvh; overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    padding: max(6px, env(safe-area-inset-top)) 10px max(6px, env(safe-area-inset-bottom));
    gap: 6px;
  }
  .wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0; }

  .top { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
  .pill {
    border: none; border-radius: 16px; padding: 6px 11px; font-family: inherit; font-size: 13px; font-weight: 700;
    background: #1f3b73; color: #fff; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.18);
  }
  .cam-btn { background: #fff; color: #1f3b73; font-size: 18px; padding: 4px 10px; }

  .flags { display: flex; gap: 14px; justify-content: center; align-items: center; }
  .flag-btn {
    width: 66px; height: 66px; border-radius: 50%; border: none; flex-shrink: 0;
    font-size: 28px; background: #fff; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,.14);
    -webkit-tap-highlight-color: transparent; font-family: inherit;
  }
  .text-btn { font-size: 19px; font-weight: 700; color: #1f3b73; }
  .id-btn { font-size: 20px; letter-spacing: -1px; white-space: nowrap; }
  .flag-btn:active { transform: scale(.94); }
  .flag-btn.listening { animation: pulse 1s infinite; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(229,57,53,.45); }
    70%  { box-shadow: 0 0 0 14px rgba(229,57,53,0); }
    100% { box-shadow: 0 0 0 0 rgba(229,57,53,0); }
  }
  .status { min-height: 16px; color: #e53935; font-size: 13px; text-align: center; }

  .paste-row { display: flex; gap: 6px; align-items: stretch; }
  .paste-row textarea {
    flex: 1; min-width: 0; resize: none; font-family: inherit; font-size: 15px; height: 46px;
    padding: 8px 10px; border-radius: 12px; border: 1px solid #c8cfdb; background: #fff; color: #222;
  }
  .small-btn {
    border: none; border-radius: 10px; padding: 0 12px; font-family: inherit; font-size: 13px; font-weight: 700;
    background: #1f3b73; color: #fff; cursor: pointer;
  }
  .small-btn.gray { background: #eef1f6; color: #1f3b73; }

  .card {
    background: #fff; border-radius: 14px; padding: 6px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .card-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #888; }
  .btns { display: flex; gap: 5px; }
  .speak {
    border: none; background: #eef3ff; border-radius: 8px; padding: 4px 9px; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .speak:disabled { opacity: .4; cursor: default; }
  .copy-btn { font-weight: 700; background: #555b63; color: #fff; font-size: 12px; }
  .text { font-size: 15px; line-height: 1.5; margin-top: 3px; min-height: 22px; max-height: 44px; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ltr { direction: ltr; text-align: left; }

  /* قسم العملات */
  .fx {
    border-radius: 18px; padding: 10px; background: #0b0f1a; color: #e5e7eb; border: 1px solid #1f2937;
    display: flex; flex-direction: column; gap: 6px;
  }
  .fx-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #9ca3af; }
  .fx-top #fx-cur { font-size: 14px; color: #d1d5db; direction: ltr; }
  .fx-input {
    width: 100%; height: 44px; border-radius: 12px; border: 1px solid #1f2937; background: #050813; color: #e5e7eb;
    text-align: center; font-family: inherit; font-size: 26px; font-weight: 700; outline: none; direction: ltr;
  }
  .amount-row { display: flex; gap: 6px; align-items: stretch; }
  .amount-row .fx-input { flex: 1; min-width: 0; }
  .clr-btn {
    width: 44px; flex-shrink: 0; border: 1px solid #1f2937; background: #111827; color: #f87171;
    border-radius: 12px; font-size: 16px; cursor: pointer;
  }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 1px solid #1f2937; background: #111827; color: #e5e7eb; border-radius: 10px;
    padding: 6px 10px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; direction: ltr;
  }
  .dirs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .dir {
    border: 1px solid #1f2937; background: #111827; color: #e5e7eb; border-radius: 12px;
    padding: 5px 4px; cursor: pointer; font-family: inherit; text-align: center;
  }
  .dir.active { border-color: #4b5563; background: #151d2e; }
  .dir .pair { font-size: 15px; direction: ltr; }
  .arr-red { color: #f87171; }
  .arr-green { color: #4ade80; }
  .dir .name { font-size: 12px; font-weight: 700; }
  .dir .code { font-size: 10px; color: #9ca3af; direction: ltr; }
  .fx-result { text-align: center; font-size: 16px; font-weight: 700; direction: ltr; overflow-wrap: anywhere; min-height: 22px; }
  .fx-hl { background: #facc15; color: #1f2937; border-radius: 8px; padding: 2px 8px; }
  .fx-note { text-align: center; font-size: 11px; color: #6b7280; direction: ltr; }

  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .key {
    height: 30px; border: none; border-radius: 9px; background: #1a2232; color: #f3f4f6;
    font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; direction: ltr;
  }
  .key:active { background: #2a3550; }
  .key.fn { background: #111827; color: #9ca3af; font-size: 14px; }
  .key.wide { grid-column: 1 / -1; }

  /* نوافذ */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10;
    display: none; align-items: flex-end; justify-content: center;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: #fff; width: 100%; max-width: 480px; max-height: 80vh; overflow-y: auto;
    border-radius: 20px 20px 0 0; padding: 14px;
  }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 16px; }
  .phr-item {
    display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: center;
    padding: 9px 2px; border-bottom: 1px solid #eee; cursor: pointer;
  }
  .phr-item:active { background: #f3f6fb; }
  .phr-ar { font-size: 15px; font-weight: 700; }
  .phr-id { font-size: 14px; color: #555; direction: ltr; text-align: left; }

  .cam-overlay { position: fixed; inset: 0; background: #000; z-index: 20; display: none; flex-direction: column; }
  .cam-overlay.open { display: flex; }
  .cam-video { width: 100%; flex: 1; min-height: 0; object-fit: cover; }
  .cam-panel { background: #fff; padding: 10px 12px max(12px, env(safe-area-inset-bottom)); border-radius: 18px 18px 0 0; margin-top: -18px; position: relative; }
  .cam-src { font-size: 13px; color: #888; direction: ltr; text-align: left; min-height: 18px; overflow-wrap: anywhere; }
  .cam-out { font-size: 17px; line-height: 1.6; min-height: 40px; max-height: 120px; overflow-y: auto; margin: 6px 0; }
  .cam-actions { display: flex; gap: 8px; }
  .cam-actions button { flex: 1; }

  .calc-overlay { align-items: center; }
  .calc {
    background: #fff; width: 90%; max-width: 300px; border-radius: 20px; padding: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .calc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 15px; font-weight: 700; }
  .calc-disp {
    background: #0b0f1a; color: #e5e7eb; border-radius: 12px; padding: 10px 12px; min-height: 52px;
    text-align: left; direction: ltr; font-size: 26px; font-weight: 700; overflow-x: auto; white-space: nowrap; margin-bottom: 8px;
  }
  .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, 40px); gap: 6px; }
  .ck {
    border: none; border-radius: 12px; background: #eef1f6; color: #1f2937; font-family: inherit;
    font-size: 17px; font-weight: 700; cursor: pointer; direction: ltr;
  }
  .ck:active { background: #d9dfeb; }
  .ck.op { background: #dbe7ff; color: #1f3b73; }
  .ck.eq { grid-row: span 2; background: #1f3b73; color: #fff; }
  .fx-result { cursor: pointer; }

  @media (max-height: 640px) {
    .flag-btn { width: 56px; height: 56px; font-size: 24px; }
    .fx-input { height: 38px; font-size: 22px; }
    .key { height: 26px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="top">
    <button id="phr-btn" class="pill">كلمات ترحيبية</button>
    <button id="cam-btn" class="pill cam-btn" title="كاميرا">📷</button>
  </div>

  <div class="flags">
    <button id="btn-ar" class="flag-btn text-btn" title="تكلم بالعربي">عربي 🎤</button>
    <button id="btn-id" class="flag-btn id-btn" title="Bicara bahasa Indonesia">🇮🇩🎤</button>
  </div>

  <div id="status" class="status"></div>

  <div class="paste-row">
    <textarea id="paste" rows="2" placeholder="اكتب أو الصق نص إنجليزي أو إندونيسي"></textarea>
  </div>

  <div class="card">
    <div class="card-head">
      <span id="src-label">الكلام</span>
      <div class="btns">
        <button id="src-copy" class="speak copy-btn" disabled>نسخ</button>
        <button id="src-speak" class="speak" disabled>📣</button>
      </div>
    </div>
    <div id="src-text" class="text"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <span id="tgt-label">الترجمة</span>
      <div class="btns">
        <button id="tgt-copy" class="speak copy-btn" disabled>نسخ</button>
        <button id="tgt-speak" class="speak" disabled>📣</button>
      </div>
    </div>
    <div id="tgt-text" class="text"></div>
  </div>

  <div class="fx">
    <div class="fx-top">
      <span>أدخل المبلغ</span>
      <span id="fx-cur">0</span>
    </div>

    <div class="amount-row">
      <input id="fx-amount" class="fx-input" type="text" inputmode="none" readonly placeholder="0">
      <button id="fx-clear" class="clr-btn" title="مسح">❌</button>
    </div>

    <div class="chips">
      <button class="chip" data-v="10">10</button>
      <button class="chip" data-v="50">50</button>
      <button class="chip" data-v="100">100</button>
      <button class="chip" data-v="500">500</button>
      <button class="chip" data-v="1000">1,000</button>
      <button class="chip" data-v="10000">10,000</button>
      <button class="chip" data-v="50000">50,000</button>
      <button class="chip" data-v="100000">100,000</button>
      <button class="chip" data-v="1000000">1,000,000</button>
    </div>

    <div class="dirs">
      <button id="dir-idr" class="dir active">
        <div class="pair">🇮🇩 <span class="arr-red">➔</span> 🇸🇦</div>
        <div class="name">روبية إلى ريال</div>
        <div class="code">IDR ➔ SAR</div>
      </button>
      <button id="dir-sar" class="dir">
        <div class="pair">🇸🇦 <span class="arr-green">➔</span> 🇮🇩</div>
        <div class="name">ريال إلى روبية</div>
        <div class="code">SAR ➔ IDR</div>
      </button>
    </div>

    <div id="fx-result" class="fx-result">—</div>

    <div class="keypad">
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key fn" data-fn="clear">C</button>
      <button class="key" data-k="0">0</button>
      <button class="key fn" data-fn="back">⌫</button>
      <button class="key wide" data-k="000">000</button>
    </div>

    <div id="fx-note" class="fx-note">جاري جلب السعر...</div>
  </div>

</div>

<!-- كلمات ترحيبية -->
<div id="phr-overlay" class="overlay">
  <div class="sheet">
    <div class="sheet-head">
      <strong>كلمات ترحيبية</strong>
      <button id="phr-close" class="speak">✕</button>
    </div>
    <div id="phr-list"></div>
  </div>
</div>

<!-- الكاميرا -->
<div id="cam-overlay" class="cam-overlay">
  <video id="cam-video" class="cam-video" autoplay playsinline muted></video>
  <canvas id="cam-canvas" style="display:none"></canvas>
  <div class="cam-panel">
    <div id="cam-src" class="cam-src"></div>
    <div id="cam-out" class="cam-out">جاري تشغيل الكاميرا...</div>
    <div class="cam-actions">
      <button id="cam-copy" class="small-btn gray">نسخ</button>
      <button id="cam-close" class="small-btn">إغلاق</button>
    </div>
  </div>
</div>

<div id="calc-overlay" class="overlay calc-overlay">
  <div class="calc">
    <div class="calc-head">
      <span>حاسبة</span>
      <button id="calc-close" class="speak">✕</button>
    </div>
    <div id="calc-disp" class="calc-disp">0</div>
    <div class="calc-grid">
      <button class="ck op" data-c="C">C</button>
      <button class="ck op" data-c="⌫">⌫</button>
      <button class="ck op" data-c="÷">÷</button>
      <button class="ck op" data-c="×">×</button>
      <button class="ck" data-c="7">7</button>
      <button class="ck" data-c="8">8</button>
      <button class="ck" data-c="9">9</button>
      <button class="ck op" data-c="-">−</button>
      <button class="ck" data-c="4">4</button>
      <button class="ck" data-c="5">5</button>
      <button class="ck" data-c="6">6</button>
      <button class="ck op" data-c="+">+</button>
      <button class="ck" data-c="1">1</button>
      <button class="ck" data-c="2">2</button>
      <button class="ck" data-c="3">3</button>
      <button class="ck eq" data-c="=">=</button>
      <button class="ck" data-c="000">000</button>
      <button class="ck" data-c="0">0</button>
      <button class="ck" data-c=".">.</button>
    </div>
  </div>
</div>

<script>
  const LANGS = {
    ar: { name: "العربية", speech: "ar-SA", label: "Arabic", code: "ar" },
    id: { name: "Indonesia", speech: "id-ID", label: "Indonesian", code: "id" }
  };

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const $ = id => document.getElementById(id);

  let rec = null;
  let listening = false;
  let liveTimer = null;
  let reqCounter = 0;

  function setStatus(t) { $('status').textContent = t; }

  /* ===== الترجمة ===== */
  async function fetchWithTimeout(url) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    try { return await fetch(url, { signal: ctrl.signal, cache: 'no-store' }); }
    finally { clearTimeout(timer); }
  }

  async function googleTranslateOnce(text, sl, tl) {
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx' +
                '&sl=' + sl + '&tl=' + tl + '&dt=t&q=' + encodeURIComponent(text);
    const res = await fetchWithTimeout(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const out = (data[0] || []).map(part => (part && part[0]) || '').join('');
    if (!out) throw new Error('empty');
    return out;
  }

  async function myMemoryOnce(text, sl, tl) {
    const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) +
                '&langpair=' + sl + '|' + tl;
    const res = await fetchWithTimeout(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const out = data && data.responseData && data.responseData.translatedText;
    if (!out) throw new Error('empty');
    return out;
  }

  async function googleTranslate(text, sl, tl) {
    const sources = sl === 'auto' ? ['auto', 'id', 'en'] : [sl];
    let lastErr = null;
    for (const s of sources) {
      try { return await googleTranslateOnce(text, s, tl); }
      catch (e) { lastErr = e; }
    }
    // احتياط: خدمة ثانية
    const fallbacks = sl === 'auto' ? ['id', 'en'] : [sl];
    for (const s of fallbacks) {
      try { return await myMemoryOnce(text, s, tl); }
      catch (e) { lastErr = e; }
    }
    throw lastErr || new Error('translate failed');
  }

  async function translate(text, src, tgt, isFinal) {
    const myReq = ++reqCounter;
    if (isFinal) setStatus('جاري الترجمة...');
    try {
      const out = await googleTranslate(text, LANGS[src].code, LANGS[tgt].code);
      if (myReq !== reqCounter) return;
      $('tgt-text').textContent = out;
      $('tgt-label').textContent = LANGS[tgt].name;
      $('tgt-speak').disabled = false;
      $('tgt-copy').disabled = false;
      $('tgt-speak').dataset.lang = tgt;
      $('src-speak').dataset.lang = src;
      $('src-text').classList.toggle('ltr', src === 'id');
      $('tgt-text').classList.toggle('ltr', tgt === 'id');
      if (isFinal) { setStatus(''); speak(out, tgt); }
    } catch (err) {
      setStatus('فشلت الترجمة، تأكد من الإنترنت');
    }
  }

  /* ===== الميكروفون ===== */
  function startListening(src) {
    if (!SR) {
      setStatus('المتصفح ما يدعم التعرف على الصوت، استخدم Chrome أو Edge');
      return;
    }
    const tgt = src === 'ar' ? 'id' : 'ar';

    rec = new SR();
    rec.lang = LANGS[src].speech;
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 1;

    let finalText = '';

    rec.onstart = () => {
      listening = true;
      $('btn-' + src).classList.add('listening');
      setStatus('تكلم الآن... (' + LANGS[src].name + ')');
      $('src-label').textContent = LANGS[src].name;
      $('tgt-label').textContent = LANGS[tgt].name;
      $('src-text').textContent = '';
      $('tgt-text').textContent = '';
      $('src-speak').disabled = true;
      $('tgt-speak').disabled = true;
      $('src-copy').disabled = true;
      $('tgt-copy').disabled = true;
      $('src-speak').dataset.lang = src;
      $('tgt-speak').dataset.lang = tgt;
    };

    rec.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += t + ' ';
        else interim += t;
      }
      const cur = (finalText + interim).trim();
      $('src-text').textContent = cur;
      clearTimeout(liveTimer);
      if (cur) liveTimer = setTimeout(() => translate(cur, src, tgt, false), 400);
    };

    rec.onerror = e => {
      if (e.error === 'no-speech') setStatus('ما سمعت شي، جرب مرة ثانية');
      else if (e.error === 'not-allowed') setStatus('اسمح للموقع باستخدام الميكروفون');
      else setStatus('خطأ في الصوت: ' + e.error);
    };

    rec.onend = () => {
      listening = false;
      $('btn-' + src).classList.remove('listening');
      const text = $('src-text').textContent.trim();
      if (text) {
        $('src-speak').disabled = false;
        $('src-copy').disabled = false;
        clearTimeout(liveTimer);
        translate(text, src, tgt, true);
      } else if (!/^(ما سمعت|اسمح|خطأ)/.test($('status').textContent)) {
        setStatus('ما سمعت شي، جرب مرة ثانية');
      }
    };

    rec.start();
  }

  function unlockSpeech() {
    if (!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
  }

  function toggle(src) {
    unlockSpeech();
    if (listening) rec.stop();
    else startListening(src);
  }

  $('btn-ar').addEventListener('click', () => toggle('ar'));
  $('btn-id').addEventListener('click', () => toggle('id'));

  /* ===== الخانة النصية + اللصق (الترجمة للعربي تلقائياً) ===== */
  async function pasteFromClipboard() {
    const box = $('paste');
    try {
      const t = await navigator.clipboard.readText();
      if (t) { box.value = t; setStatus(''); translatePasted(); return; }
    } catch (e) { /* نفعّل الخانة بدل ذلك */ }
    setStatus('');
    box.focus();
    box.select();
  }

  function translatePasted() {
    const text = $('paste').value.trim();
    if (!text) {
      $('src-text').textContent = '';
      $('tgt-text').textContent = '';
      $('src-speak').disabled = $('src-copy').disabled = true;
      $('tgt-speak').disabled = $('tgt-copy').disabled = true;
      setStatus('');
      return;
    }
    unlockSpeech();
    $('src-label').textContent = 'الأصل';
    $('src-text').textContent = text;
    $('src-text').classList.toggle('ltr', /[A-Za-z]/.test(text));
    $('src-speak').disabled = false;
    $('src-copy').disabled = false;
    $('src-speak').dataset.lang = 'id';
    $('tgt-label').textContent = LANGS.ar.name;
    $('tgt-text').textContent = '';
    $('tgt-text').classList.remove('ltr');
    translateAuto(text);
  }

  async function translateAuto(text) {
    const myReq = ++reqCounter;
    setStatus('جاري الترجمة...');
    try {
      const out = await googleTranslate(text, 'auto', 'ar');
      if (myReq !== reqCounter) return;
      $('tgt-text').textContent = out;
      $('tgt-speak').disabled = false;
      $('tgt-copy').disabled = false;
      $('tgt-speak').dataset.lang = 'ar';
      setStatus('');
    } catch (e) {
      setStatus('فشلت الترجمة، تأكد من الإنترنت (' + (e.message || 'خطأ') + ')');
    }
  }

  let typeTimer = null;
  $('paste').addEventListener('input', () => {
    clearTimeout(typeTimer);
    typeTimer = setTimeout(translatePasted, 300);
  });

  /* ===== النطق والنسخ ===== */
  function speak(text, lang) {
    if (!text || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = LANGS[lang].speech;
    speechSynthesis.speak(u);
  }

  function copyText(text, btn) {
    if (!text) return;
    const done = () => {
      const old = btn.textContent;
      btn.textContent = 'تم ✅';
      setTimeout(() => { btn.textContent = old; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { setStatus('ما قدرت أنسخ النص'); }
    document.body.removeChild(ta);
  }

  $('src-speak').addEventListener('click', () => speak($('src-text').textContent, $('src-speak').dataset.lang || 'id'));
  $('tgt-speak').addEventListener('click', () => speak($('tgt-text').textContent, $('tgt-speak').dataset.lang || 'ar'));
  $('src-copy').addEventListener('click', () => copyText($('src-text').textContent.trim(), $('src-copy')));
  $('tgt-copy').addEventListener('click', () => copyText($('tgt-text').textContent.trim(), $('tgt-copy')));

  /* ===== الكاميرا والتعرف على النص ===== */
  let camStream = null, ocrWorker = null, ocrTimer = null, lastOcr = '';

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  async function openCamera() {
    $('cam-overlay').classList.add('open');
    $('cam-out').textContent = 'جاري تشغيل الكاميرا...';
    try {
      camStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } }, audio: false
      });
      $('cam-video').srcObject = camStream;
      await $('cam-video').play();
    } catch (e) {
      $('cam-out').textContent = 'ما قدرت أشغل الكاميرا، اسمح للموقع باستخدامها';
      return;
    }
    try {
      $('cam-out').textContent = 'جاري تحميل أداة القراءة (أول مرة تاخذ وقت)...';
      if (!window.Tesseract) {
        await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
      }
      if (!ocrWorker) ocrWorker = await Tesseract.createWorker('eng+ind');
      $('cam-out').textContent = 'وجّه الكاميرا على النص...';
      scanLoop();
    } catch (e) {
      $('cam-out').textContent = 'تعذر تحميل أداة القراءة، تأكد من الإنترنت';
    }
  }

  async function scanLoop() {
    if (!camStream || !ocrWorker) return;
    const v = $('cam-video');
    const c = $('cam-canvas');
    if (v.videoWidth) {
      const w = Math.min(v.videoWidth, 800);
      const h = Math.round(v.videoHeight * w / v.videoWidth);
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(v, 0, 0, w, h);
      try {
        const { data } = await ocrWorker.recognize(c);
        const t = data.text.replace(/\s+/g, ' ').trim();
        if (t.length > 2 && t !== lastOcr) {
          lastOcr = t;
          $('cam-src').textContent = t;
          const out = await googleTranslate(t, 'auto', 'ar');
          $('cam-out').textContent = out;
        }
      } catch (e) { /* نكمل المحاولة */ }
    }
    if (camStream) ocrTimer = setTimeout(scanLoop, 1500);
  }

  function closeCamera() {
    clearTimeout(ocrTimer);
    if (camStream) camStream.getTracks().forEach(t => t.stop());
    camStream = null;
    $('cam-video').srcObject = null;
    $('cam-overlay').classList.remove('open');
  }

  $('cam-btn').addEventListener('click', openCamera);
  $('cam-close').addEventListener('click', closeCamera);
  $('cam-copy').addEventListener('click', () => copyText($('cam-out').textContent.trim(), $('cam-copy')));

  /* ===== كلمات ترحيبية ===== */
  const PHRASES = [
    ["مرحباً بك", "Selamat datang"],
    ["كيف حالك؟", "Apa kabar?"],
    ["أنا بخير، شكراً", "Saya baik, terima kasih"],
    ["ما اسمك؟", "Siapa nama Anda?"],
    ["اسمي ...", "Nama saya ..."],
    ["من وين أنت؟", "Anda dari mana?"],
    ["أنا من السعودية", "Saya dari Arab Saudi"],
    ["بكم هذا؟", "Berapa harganya?"],
    ["غالي", "Mahal"],
    ["رخيص", "Murah"],
    ["ممكن تخفض السعر؟", "Bisa kurangi harganya?"],
    ["أبغى هذا", "Saya mau yang ini"],
    ["وين الحمام؟", "Di mana toiletnya?"],
    ["وين أقرب مطار؟", "Di mana bandara terdekat?"],
    ["أنا جوعان", "Saya lapar"],
    ["هذا لذيذ", "Ini enak"],
    ["ما أفهم", "Saya tidak mengerti"],
    ["تكلم ببطء من فضلك", "Tolong bicara pelan-pelan"],
    ["ساعدني من فضلك", "Tolong bantu saya"],
    ["ممكن صورة؟", "Boleh foto?"],
    ["الحساب من فضلك", "Minta bonnya"],
    ["شكراً جزيلاً", "Terima kasih banyak"],
    ["عفواً", "Sama-sama"],
    ["مع السلامة", "Sampai jumpa"]
  ];

  function renderPhrases() {
    const box = $('phr-list');
    box.innerHTML = '';
    PHRASES.forEach(([ar, id]) => {
      const row = document.createElement('div');
      row.className = 'phr-item';
      const a = document.createElement('div');
      a.className = 'phr-ar';
      a.textContent = ar;
      const i = document.createElement('div');
      i.className = 'phr-id';
      i.textContent = id;
      const s = document.createElement('span');
      s.textContent = '📣';
      row.append(a, i, s);
      row.addEventListener('click', () => speak(id, 'id'));
      box.appendChild(row);
    });
  }

  $('phr-btn').addEventListener('click', () => $('phr-overlay').classList.add('open'));
  $('phr-close').addEventListener('click', () => $('phr-overlay').classList.remove('open'));
  $('phr-overlay').addEventListener('click', e => {
    if (e.target === $('phr-overlay')) $('phr-overlay').classList.remove('open');
  });
  renderPhrases();

  /* ===== تحويل العملات ===== */
  const FALLBACK_IDR_PER_SAR = 4200;
  const RATE_SOURCES = [
    { url: 'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/sar.json', read: d => d.sar.idr },
    { url: 'https://latest.currency-api.pages.dev/v1/currencies/sar.json', read: d => d.sar.idr },
    { url: 'https://open.er-api.com/v6/latest/SAR', read: d => d.rates.IDR }
  ];

  let idrPerSar = null;
  let fxDir = 'IDR';
  let lastRes = null;

  async function loadRates() {
    let got = null;
    for (const src of RATE_SOURCES) {
      try {
        const r = await fetch(src.url, { cache: 'no-store' });
        if (!r.ok) continue;
        const v = Number(src.read(await r.json()));
        if (v > 0) { got = v; break; }
      } catch (e) { /* المصدر اللي بعده */ }
    }
    if (got) {
      idrPerSar = got;
      $('fx-note').textContent = 'آخر تحديث للسعر: ' + new Date().toLocaleString('ar', { dateStyle: 'medium', timeStyle: 'short' });
    } else {
      idrPerSar = FALLBACK_IDR_PER_SAR;
      $('fx-note').textContent = 'تعذر جلب السعر الحالي، الحاسبة تستخدم سعر تقريبي';
    }
    convert();
  }

  function parseAmount(s) {
    s = (s || '')
      .replace(/[\u0660-\u0669]/g, d => d.charCodeAt(0) - 0x0660)
      .replace(/[\u06F0-\u06F9]/g, d => d.charCodeAt(0) - 0x06F0)
      .replace(/\u066B/g, '.')
      .replace(/[,\u066C\s]/g, '');
    return parseFloat(s);
  }

  function fmt(n, cur) {
    if (cur === 'IDR') return Math.round(n).toLocaleString('en-US');
    return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function setDir(d) {
    fxDir = d;
    $('dir-idr').classList.toggle('active', d === 'IDR');
    $('dir-sar').classList.toggle('active', d === 'SAR');
    convert();
  }

  function convert() {
    const amt = parseAmount($('fx-amount').value);
    const from = fxDir;
    const to = from === 'IDR' ? 'SAR' : 'IDR';
    $('fx-cur').textContent = isNaN(amt) ? '0' : fmt(amt, from);
    if (!idrPerSar || isNaN(amt)) {
      $('fx-result').textContent = '—';
      lastRes = null;
      return;
    }
    const sar = from === 'SAR' ? amt : amt / idrPerSar;
    const res = to === 'SAR' ? sar : sar * idrPerSar;
    lastRes = res;
    const r = $('fx-result');
    r.textContent = fmt(amt, from) + ' ' + from + ' = ';
    const hl = document.createElement('span');
    hl.className = 'fx-hl';
    hl.textContent = fmt(res, to) + ' ' + to;
    r.appendChild(hl);
  }

  $('fx-clear').addEventListener('click', () => { $('fx-amount').value = ''; convert(); });
  $('dir-idr').addEventListener('click', () => setDir('IDR'));
  $('dir-sar').addEventListener('click', () => setDir('SAR'));

  document.querySelectorAll('.chip').forEach(b => {
    b.addEventListener('click', () => { $('fx-amount').value = b.dataset.v; convert(); });
  });

  // لوحة الأرقام على الشاشة (تحتوي 000 تحت الصفر)
  document.querySelectorAll('.key').forEach(k => {
    k.addEventListener('click', () => {
      let v = $('fx-amount').value;
      if (k.dataset.fn === 'clear') v = '';
      else if (k.dataset.fn === 'back') v = v.slice(0, -1);
      else if (k.dataset.k) {
        if (v.length + k.dataset.k.length <= 15) v += k.dataset.k;
      }
      $('fx-amount').value = v;
      convert();
    });
  });

  /* ===== حاسبة منبثقة ===== */
  let calcExpr = '0';
  let calcFresh = true;

  function renderCalc() {
    $('calc-disp').textContent = calcExpr;
  }

  function openCalc() {
    if (lastRes === null || !isFinite(lastRes)) return;
    calcExpr = String(Math.round(lastRes * 100) / 100);
    calcFresh = true;
    renderCalc();
    $('calc-overlay').classList.add('open');
  }

  function evalCalc(s) {
    const expr = s.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
    if (!/^[0-9+\-*/.()\s]+$/.test(expr)) throw new Error('bad');
    const v = Function('return (' + expr + ')')();
    if (!isFinite(v)) throw new Error('inf');
    return Math.round(v * 100) / 100;
  }

  function calcPress(k) {
    if (k === 'C') {
      calcExpr = '0'; calcFresh = true;
    } else if (k === '⌫') {
      calcExpr = calcExpr.length > 1 ? calcExpr.slice(0, -1) : '0';
      calcFresh = false;
    } else if (k === '=') {
      try { calcExpr = String(evalCalc(calcExpr)); }
      catch (e) { calcExpr = 'خطأ'; }
      calcFresh = true;
    } else if (['+', '-', '×', '÷'].includes(k)) {
      if (calcExpr === 'خطأ') calcExpr = '0';
      calcExpr += k;
      calcFresh = false;
    } else {
      // أرقام و. و 000
      if (calcFresh) calcExpr = k === '.' ? '0.' : k;
      else if (calcExpr === '0' && k !== '.') calcExpr = k;
      else calcExpr += k;
      calcFresh = false;
    }
    renderCalc();
  }

  $('fx-result').addEventListener('click', openCalc);
  $('calc-close').addEventListener('click', () => $('calc-overlay').classList.remove('open'));
  $('calc-overlay').addEventListener('click', e => {
    if (e.target === $('calc-overlay')) $('calc-overlay').classList.remove('open');
  });
  document.querySelectorAll('.ck').forEach(b => {
    b.addEventListener('click', () => calcPress(b.dataset.c));
  });

  loadRates();
</script>
</body>
</html>
